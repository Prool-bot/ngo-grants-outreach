name: Organization contact catalog
on:
  push:
    branches: [main]
    paths:
      - 'catalog_research/contact_sync.py'
      - 'catalog_research/test_contact_sync.py'
      - '.github/workflows/contact-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1-5'
permissions:
  contents: read
concurrency:
  group: organization-contact-catalog
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 google-api-python-client google-auth
      - run: python -m unittest catalog_research.test_contact_sync
      - name: Discover new organizations and enrich existing contacts
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRM_ID: ${{ secrets.CRM_ID }}
        run: python -m catalog_research.contact_sync --limit 100 --enrich-limit 20
