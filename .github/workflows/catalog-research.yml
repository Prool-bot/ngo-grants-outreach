name: Public knowledge catalog — 115 categories
on:
  push:
    branches: [main]
    paths:
      - 'catalog_research/**'
      - '.github/workflows/catalog-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-knowledge-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m unittest catalog_research.test_catalog
      - name: Search all 115 categories
        run: python -m catalog_research.run --output catalog-output
      - name: Publish research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-knowledge-catalog
          path: catalog-output/
          if-no-files-found: warn
          retention-days: 30
