name: NGO Grants Outreach — procurement monitoring
on:
  push:
    branches: [main]
    paths:
      - 'outreach.py'
      - 'smtp_preflight.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/outreach.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = Google API; monitor = procurement; smtp-check = SMTP auth; smtp-self-test = own mailbox only'
        type: choice
        options: [check, monitor, smtp-check, smtp-self-test]
        default: check
permissions:
  contents: read
concurrency:
  group: outreach-crm
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run explicitly requested mode
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'check' || inputs.mode == 'monitor')
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON }}
          CRM_ID: ${{ secrets.CRM_ID }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
          MODE: ${{ inputs.mode }}
        run: python outreach.py --mode "$MODE"
      - name: Check SMTP configuration
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'smtp-check' || inputs.mode == 'smtp-self-test'))
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
          SEND_SELF_TEST: ${{ inputs.mode == 'smtp-self-test' }}
        run: |
          missing=0
          for key in EMAIL_ADDRESS EMAIL_APP_PASSWORD EXPECTED_GMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then exit 1; fi
          python smtp_preflight.py
