name: NGO Grants — procurement research
on:
  push:
    branches: [main]
    paths:
      - 'outreach.py'
      - 'public_sources.py'
      - 'directory_sources.py'
      - 'procurement_quality.py'
      - 'registry_audit.py'
      - 'google_preflight.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/outreach.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Registry research only; legacy report mode is disabled'
        type: choice
        options: [check, monitor, preview, pilot, sources-check, registry-audit, report]
        default: check
permissions:
  contents: read
concurrency:
  group: outreach-crm
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Research registry
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'check' || inputs.mode == 'monitor' || inputs.mode == 'preview' || inputs.mode == 'pilot'))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EXPECTED_SERVICE_ACCOUNT: ngo-grants-outreach@ngo-grants-outreach.iam.gserviceaccount.com
          CRM_ID: ${{ secrets.CRM_ID }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
          MODE: ${{ github.event_name == 'push' && 'check' || inputs.mode }}
        run: |
          python outreach.py --mode "$MODE"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then python outreach.py --mode preview; fi
      - name: Check public procurement APIs
        if: github.event_name == 'push' || inputs.mode == 'sources-check'
        run: python public_sources.py
      - name: Refresh procurement statuses
        if: success() && (github.event_name == 'push' || inputs.mode == 'monitor' || inputs.mode == 'registry-audit')
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EXPECTED_SERVICE_ACCOUNT: ngo-grants-outreach@ngo-grants-outreach.iam.gserviceaccount.com
          CRM_ID: ${{ secrets.CRM_ID }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
        run: python registry_audit.py --apply
      - name: Legacy report retired
        if: inputs.mode == 'report'
        run: echo 'MAIL_MODULE_REMOVED; no mail operation'
