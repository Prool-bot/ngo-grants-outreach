name: NGO Grants Outreach — procurement monitoring
on:
  push:
    branches: [main]
    paths:
      - 'outreach.py'
      - 'smtp_preflight.py'
      - 'public_sources.py'
      - 'directory_sources.py'
      - 'daily_report.py'
      - 'google_preflight.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/outreach.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = Google API; monitor = procurement; preview = read-only full search; pilot = one-time registry test; report = owner-only daily report; smtp-check = SMTP auth; smtp-self-test = own mailbox only; sources-check = public API test; imap-check = mailbox read-only test'
        type: choice
        options: [check, monitor, preview, pilot, report-preview, report, smtp-check, smtp-self-test, sources-check, imap-check]
        default: check
permissions:
  contents: read
concurrency:
  group: outreach-crm
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run explicitly requested mode
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'check' || inputs.mode == 'monitor' || inputs.mode == 'preview' || inputs.mode == 'pilot'))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EXPECTED_SERVICE_ACCOUNT: ngo-grants-outreach@ngo-grants-outreach.iam.gserviceaccount.com
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          CRM_ID: ${{ secrets.CRM_ID }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
          MODE: ${{ github.event_name == 'push' && 'check' || inputs.mode }}
          PILOT_REQUEST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[one-time-pilot]') }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1
          fi
          python outreach.py --mode "$MODE"
          if [ "$MODE" = "check" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python outreach.py --mode preview
            if [ "$PILOT_REQUEST" = "true" ]; then python outreach.py --mode pilot; fi
          fi
      - name: Check SMTP configuration
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'smtp-check' || inputs.mode == 'smtp-self-test')))
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
          SEND_SELF_TEST: ${{ inputs.mode == 'smtp-self-test' }}
        run: |
          missing=0
          for key in EMAIL_ADDRESS EMAIL_APP_PASSWORD EXPECTED_GMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then exit 1; fi
          python smtp_preflight.py
      - name: Test public procurement APIs
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sources-check'))
        run: python public_sources.py
      - name: Check IMAP inbox without reading messages
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'imap-check'
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
        run: python google_preflight.py --mode imap-check
      - name: Owner report
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'report-preview' || inputs.mode == 'report'))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EXPECTED_SERVICE_ACCOUNT: ngo-grants-outreach@ngo-grants-outreach.iam.gserviceaccount.com
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          CRM_ID: ${{ secrets.CRM_ID }}
          EXPECTED_GMAIL: ${{ secrets.EXPECTED_GMAIL }}
          REPORT_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'report' }}
        run: |
          if [ "$REPORT_SEND" = "true" ]; then python daily_report.py --send; else python daily_report.py; fi
